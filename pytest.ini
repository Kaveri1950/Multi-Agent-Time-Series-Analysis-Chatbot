[pytest]
markers =
    slow: full end-to-end multi-agent runs that invoke the local LLM (can take 1-2+ minutes each on CPU-only hardware)
    network: calls a live data source (Yahoo Finance, NSE, mfapi, NOAA); skipped in CI, where those sources often block cloud IPs
    needs_data: needs the cached price panel and fitted volatility model under data/cache/; skipped automatically when absent
