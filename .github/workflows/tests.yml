name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # slow    = runs the local LLM (no Ollama here)
      # network = live Yahoo/NSE/NOAA calls, which often block cloud IPs
      # tests that need data/cache/ skip themselves (tests/conftest.py)
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q -m "not slow and not network" -rs
